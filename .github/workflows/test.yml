name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm exec eslint .

      - name: Unit tests
        run: pnpm test:unit

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright tests (fixtures)
        run: pnpm exec playwright test

      - name: Playwright tests (examples scan)
        run: pnpm exec playwright test --config playwright.examples.config.mjs --grep-invert visual

      # TODO: components is excluded because its 50-slide deck exceeds the 10-minute
      # test timeout (and the 15-minute job limit) before all screenshots are taken.
      # To re-include: raise timeout-minutes to ≥30 and test.setTimeout in
      # visual.spec.mjs to ≥20 min, then generate linux baselines with
      # pnpm test:visual:update --project components and commit them.
      - name: Playwright visual regression
        run: pnpm exec playwright test --config playwright.examples.config.mjs --grep visual --project full-deck --project layouts --project math --project tweaks

      - name: Upload visual snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshots-actual
          path: test-results/
          retention-days: 7

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
